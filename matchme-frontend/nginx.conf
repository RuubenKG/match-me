server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 🚀 THE MAGIC LINE:
        # It tries to find the file ($uri), then a directory ($uri/),
        # and if both fail, it serves index.html (allowing React Router to take over)
        try_files $uri $uri/ /index.html;
    }

    # Optional: Handle error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}